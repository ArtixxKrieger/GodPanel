kind = "web"
previewPath = "/monitor/"
title = "ArtixPOS Health Monitor"
version = "1.0.0"
id = "artifacts/artix-monitor"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/monitor/" ]
localPort = 20435

[services.development]
run = "pnpm --filter @workspace/artix-monitor run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/artix-monitor", "run", "build" ]
publicDir = "artifacts/artix-monitor/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20435"
BASE_PATH = "/monitor/"
